buildscript 
{
  repositories 
  {
    mavenCentral()
    jcenter()
    google()
  }
  dependencies 
  {
    classpath 'com.android.tools.build:gradle:8.4.1'
    classpath 'io.objectbox:objectbox-gradle-plugin:5.1.0' // 这个必须加！
  }
}

// allprojects 块已移除，仓库配置统一在 settings.gradle 中管理
// 避免与 settings.gradle 中的 repositoriesMode 冲突