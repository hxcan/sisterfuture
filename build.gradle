buildscript 
{
  repositories 
  {
    mavenCentral()
    jcenter()
    google()
  }
  dependencies 
  {
    classpath 'com.android.tools.build:gradle:8.4.1'
    classpath 'io.objectbox:objectbox-gradle-plugin:5.1.0' // 这个必须加！
  }
}

allprojects 
{
  repositories 
  {
    mavenCentral()
    maven { url "https://jitpack.io" }
    // 百度地图 SDK 官方 Maven 仓库
    maven { url 'https://maven.baidu.com' }
    maven { url 'https://jcenter.bintray.com' }
    jcenter()
    google()
  }
}
